<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <span>📋 TaskFlow</span>
    <div>
      <span id="userGreeting"></span>
      <a href="dashboard.html">Dashboard</a>
      <a href="projects.html">Projects</a>
      <a href="tasks.html">Tasks</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem">
      <h2>📂 Projects</h2>
      <button class="btn-primary" id="newProjectBtn" onclick="openModal()">+ New Project</button>
    </div>

    <!-- Projects Grid -->
    <div id="projectsGrid" class="card-grid">
      <p id="loadingMsg">Loading projects...</p>
    </div>
  </div>

  <!-- Create Project Modal -->
  <div class="modal" id="projectModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem">
        <h3>➕ Create New Project</h3>
        <button onclick="closeModal()" style="width:auto; background:none; color:#666; font-size:1.5rem; padding:0">×</button>
      </div>

      <div class="form-group">
        <label>Project Name *</label>
        <input type="text" id="projectName" placeholder="Enter project name" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="projectDesc" rows="3" placeholder="Project description (optional)"
          style="width:100%; padding:0.7rem; border:1px solid #ddd; border-radius:8px; resize:vertical"></textarea>
      </div>

      <div class="form-group" id="memberSelectGroup">
        <label>Add Members</label>
        <div id="membersList" style="max-height:180px; overflow-y:auto; border:1px solid #ddd; border-radius:8px; padding:0.5rem">
          <p style="color:#999; font-size:0.9rem">Loading users...</p>
        </div>
      </div>

      <p id="modalMessage" class="message"></p>

      <div style="display:flex; gap:1rem; margin-top:1rem">
        <button class="btn-primary" onclick="createProject()">Create Project</button>
        <button onclick="closeModal()"
          style="width:auto; padding:0.7rem 1.5rem; background:#f3f4f6; color:#333; border:none; border-radius:8px; cursor:pointer">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Project Detail Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
        <h3 id="detailProjectName">Project Details</h3>
        <button onclick="closeDetailModal()" style="width:auto; background:none; color:#666; font-size:1.5rem; padding:0">×</button>
      </div>

      <p id="detailProjectDesc" style="color:#666; margin-bottom:1rem"></p>

      <h4 style="margin-bottom:0.5rem">👥 Members</h4>
      <div id="detailMembers" style="margin-bottom:1.5rem"></div>

      <h4 style="margin-bottom:0.5rem">✅ Tasks</h4>
      <div id="detailTasks"></div>

      <div style="margin-top:1.5rem">
        <a id="goToTasksBtn" href="#" class="btn-primary"
          style="display:inline-block; text-decoration:none; padding:0.7rem 1.5rem">
          + Add Task to This Project
        </a>
      </div>
    </div>
  </div>

  <script src="js/projects.js"></script>
</body>
</html>
