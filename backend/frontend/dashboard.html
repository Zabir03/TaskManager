<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TaskFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span>📋 TaskFlow</span>
    <div>
      <span id="userGreeting"></span>
      <a href="dashboard.html">Dashboard</a>
      <a href="projects.html">Projects</a>
      <a href="tasks.html">Tasks</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h2 style="margin-bottom:1.5rem">📊 Dashboard</h2>

    <div class="stats-grid">
      <div class="stat-card blue">
        <h3 id="totalProjects">0</h3>
        <p>Total Projects</p>
      </div>
      <div class="stat-card green">
        <h3 id="doneTasks">0</h3>
        <p>Completed Tasks</p>
      </div>
      <div class="stat-card yellow">
        <h3 id="inProgressTasks">0</h3>
        <p>In Progress</p>
      </div>
      <div class="stat-card red">
        <h3 id="overdueTasks">0</h3>
        <p>Overdue Tasks</p>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-top:1rem">
      <!-- Overdue Tasks -->
      <div>
        <h3 style="margin-bottom:1rem">⚠️ Overdue Tasks</h3>
        <div id="overdueList" class="task-list"></div>
      </div>

      <!-- Quick Links -->
      <div>
        <h3 style="margin-bottom:1rem">🚀 Quick Actions</h3>
        <div style="display:flex; flex-direction:column; gap:0.8rem">
          <a href="projects.html"
            style="background:#4f46e5; color:white; padding:1rem; border-radius:10px;
            text-decoration:none; text-align:center; font-weight:500">
            📂 View All Projects
          </a>
          <a href="tasks.html"
            style="background:#10b981; color:white; padding:1rem; border-radius:10px;
            text-decoration:none; text-align:center; font-weight:500">
            ✅ View All Tasks
          </a>
          <a href="tasks.html"
            style="background:#f59e0b; color:white; padding:1rem; border-radius:10px;
            text-decoration:none; text-align:center; font-weight:500">
            ➕ Create New Task
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
