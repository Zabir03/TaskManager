<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>📋 TaskFlow</h1>
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <!-- Login Form -->
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Enter your email address" />
        <input type="password" id="loginPassword" placeholder="Enter your password" />
        <button onclick="login()">Login</button>
      </div>

      <!-- Signup Form -->
      <!-- Signup Form -->
      <div id="signupForm" style="display:none">
        <div class="form-group">
          <input type="text" id="signupName" placeholder="Full Name" />
        </div>
        <div class="form-group">
          <input type="email" id="signupEmail" placeholder="Email Address" />
        </div>
        <div class="form-group">
          <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" />
        </div>
        <div class="form-group">
          <select id="signupRole">
            <option value="member">👤 Member</option>
            <option value="admin">👑 Admin</option>
          </select>
        </div>
        <button type="button" onclick="signup()">Create Account</button>
      </div>

      <p id="authMessage" class="message"></p>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>

</html>
